version: 2

project_name: proxymetrics

before:
  hooks:
    - go mod tidy

builds:
  - id: proxymetrics
    main: ./cmd/proxymetrics
    binary: proxymetrics
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/drsoft-oss/proxymetrics/internal/cli.Version={{.Version}}
      - -X github.com/drsoft-oss/proxymetrics/internal/cli.GitCommit={{.ShortCommit}}
      - -X github.com/drsoft-oss/proxymetrics/internal/cli.BuildDate={{.Date}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: "^.*feat(\\(.+\\))?!?:.*$"
      order: 0
    - title: Bug fixes
      regexp: "^.*fix(\\(.+\\))?!?:.*$"
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

homebrew_casks:
  - name: proxymetrics
    description: "Self-hosted MITM proxy router that tracks per-request proxy spend across vendors"
    homepage: "https://github.com/drsoft-oss/proxymetrics"
    binary: proxymetrics
    url:
      verified: "github.com/drsoft-oss/proxymetrics/"
    repository:
      owner: drsoft-oss
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@drsoft-oss.dev
    skip_upload: auto
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/proxymetrics"]
          end

release:
  github:
    owner: drsoft-oss
    name: proxymetrics
  draft: false
  prerelease: auto
