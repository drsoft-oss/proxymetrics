version: 2

project_name: proxymetrics

before:
  hooks:
    - go mod tidy

builds:
  - id: proxymetrics-linux-amd64
    main: ./cmd/proxymetrics
    binary: proxymetrics
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target x86_64-linux-gnu
      - CXX=zig c++ -target x86_64-linux-gnu
    goos: [linux]
    goarch: [amd64]
    ldflags:
      - -s -w
      - -X github.com/drsoft-oss/proxymetrics/internal/cli.Version={{.Version}}
      - -X github.com/drsoft-oss/proxymetrics/internal/cli.GitCommit={{.ShortCommit}}
      - -X github.com/drsoft-oss/proxymetrics/internal/cli.BuildDate={{.Date}}

  - id: proxymetrics-linux-arm64
    main: ./cmd/proxymetrics
    binary: proxymetrics
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target aarch64-linux-gnu
      - CXX=zig c++ -target aarch64-linux-gnu
    goos: [linux]
    goarch: [arm64]
    ldflags:
      - -s -w
      - -X github.com/drsoft-oss/proxymetrics/internal/cli.Version={{.Version}}
      - -X github.com/drsoft-oss/proxymetrics/internal/cli.GitCommit={{.ShortCommit}}
      - -X github.com/drsoft-oss/proxymetrics/internal/cli.BuildDate={{.Date}}

  - id: proxymetrics-darwin-amd64
    main: ./cmd/proxymetrics
    binary: proxymetrics
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target x86_64-macos
      - CXX=zig c++ -target x86_64-macos
    goos: [darwin]
    goarch: [amd64]
    ldflags:
      - -s -w
      - -X github.com/drsoft-oss/proxymetrics/internal/cli.Version={{.Version}}
      - -X github.com/drsoft-oss/proxymetrics/internal/cli.GitCommit={{.ShortCommit}}
      - -X github.com/drsoft-oss/proxymetrics/internal/cli.BuildDate={{.Date}}

  - id: proxymetrics-darwin-arm64
    main: ./cmd/proxymetrics
    binary: proxymetrics
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target aarch64-macos
      - CXX=zig c++ -target aarch64-macos
    goos: [darwin]
    goarch: [arm64]
    ldflags:
      - -s -w
      - -X github.com/drsoft-oss/proxymetrics/internal/cli.Version={{.Version}}
      - -X github.com/drsoft-oss/proxymetrics/internal/cli.GitCommit={{.ShortCommit}}
      - -X github.com/drsoft-oss/proxymetrics/internal/cli.BuildDate={{.Date}}

  - id: proxymetrics-windows-amd64
    main: ./cmd/proxymetrics
    binary: proxymetrics
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target x86_64-windows-gnu
      - CXX=zig c++ -target x86_64-windows-gnu
    goos: [windows]
    goarch: [amd64]
    ldflags:
      - -s -w
      - -X github.com/drsoft-oss/proxymetrics/internal/cli.Version={{.Version}}
      - -X github.com/drsoft-oss/proxymetrics/internal/cli.GitCommit={{.ShortCommit}}
      - -X github.com/drsoft-oss/proxymetrics/internal/cli.BuildDate={{.Date}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: "^.*feat(\\(.+\\))?!?:.*$"
      order: 0
    - title: Bug fixes
      regexp: "^.*fix(\\(.+\\))?!?:.*$"
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

brews:
  - name: proxymetrics
    description: "Self-hosted MITM proxy router that tracks per-request proxy spend across vendors"
    homepage: "https://github.com/drsoft-oss/proxymetrics"
    license: "MIT"
    repository:
      owner: drsoft-oss
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@drsoft-oss.dev
    directory: Formula
    skip_upload: auto
    install: |
      bin.install "proxymetrics"
    test: |
      assert_match "proxymetrics", shell_output("#{bin}/proxymetrics --version")

release:
  github:
    owner: drsoft-oss
    name: proxymetrics
  draft: false
  prerelease: auto
